<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/plain" id="app-code">
        const { useMemo, useState } = React;

        const IconBase = ({ size = 24, className = "", children, ...props }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
                {...props}
            >
                {children}
            </svg>
        );

        const Calculator = (props) => (
            <IconBase {...props}>
                <rect width="16" height="20" x="4" y="2" rx="2" />
                <line x1="8" x2="16" y1="6" y2="6" />
                <line x1="16" x2="16" y1="14" y2="18" />
                <path d="M16 10h.01" /><path d="M12 10h.01" /><path d="M8 10h.01" />
                <path d="M12 14h.01" /><path d="M8 14h.01" /><path d="M12 18h.01" /><path d="M8 18h.01" />
            </IconBase>
        );
        const ShoppingBag = (props) => (
            <IconBase {...props}>
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
                <path d="M16 10a4 4 0 0 1-8 0" />
            </IconBase>
        );
        const Shield = (props) => (
            <IconBase {...props}>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
            </IconBase>
        );
        const Gem = (props) => (
            <IconBase {...props}>
                <path d="M6 3h12l4 6-10 13L2 9Z" />
            </IconBase>
        );
        const Zap = (props) => (
            <IconBase {...props}>
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </IconBase>
        );
        const Info = (props) => (
            <IconBase {...props}>
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
            </IconBase>
        );
        const RotateCcw = (props) => (
            <IconBase {...props}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12" />
                <path d="M3 3v9h9" />
            </IconBase>
        );
        const Coins = (props) => (
            <IconBase {...props}>
                <circle cx="8" cy="8" r="6" />
                <path d="M18.09 10.37A6 6 0 1 1 10.34 18" />
                <path d="M7 6h1v4" />
                <path d="m7.1 13.8 3-3.8" />
            </IconBase>
        );
        const ChevronDown = (props) => (
            <IconBase {...props}>
                <path d="m6 9 6 6 6-6" />
            </IconBase>
        );
        const ExternalLink = (props) => (
            <IconBase {...props}>
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
            </IconBase>
        );
        const ArrowRight = (props) => (
            <IconBase {...props}>
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
            </IconBase>
        );
        const Package = (props) => (
            <IconBase {...props}>
                <path d="m16.5 9.4-9-5.19" />
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                <path d="M3.27 6.96 12 12.01l8.73-5.05" />
                <path d="M12 22.08V12" />
            </IconBase>
        );
        const Heart = (props) => (
            <IconBase {...props}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            </IconBase>
        );
        const MessageCircle = (props) => (
            <IconBase {...props}>
                <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z" />
                <path d="M8 10h.01" />
                <path d="M12 10h.01" />
                <path d="M16 10h.01" />
            </IconBase>
        );

        const RARITY_COSTS = {
            rare: {
                name: "稀有",
                cost: 1,
                badgeClass: "bg-blue-900/30 text-blue-300 border-blue-500/50",
                dotClass: "bg-blue-400"
            },
            hero: {
                name: "英雄",
                cost: 7,
                badgeClass: "bg-red-900/30 text-red-300 border-red-500/50",
                dotClass: "bg-red-400"
            },
            legend: {
                name: "傳說",
                cost: 20,
                badgeClass: "bg-purple-900/30 text-purple-300 border-purple-500/50",
                dotClass: "bg-purple-400"
            },
            mythic: {
                name: "神話",
                cost: 375,
                badgeClass: "bg-amber-900/30 text-amber-300 border-amber-500/50",
                dotClass: "bg-amber-400"
            }
        };

        const PROFICIENCY_COSTS = [1, 3, 6, 12, 24, 24, 24, 24];

        const DATA_STRUCTURE = [
            {
                id: "combined",
                name: "核心項目",
                icon: <Package className="w-5 h-5" />,
                note: "依裝備、符石與熟練度分別計算",
                items: [
                    { name: "裝備", max: 3, type: "equipment" },
                    { name: "符石", max: 2, type: "rune", itemNote: "符石固定以稀有成本計算" },
                    { name: "熟練度階段", max: 8, type: "proficiency", itemNote: "依階段累加轉職幣" }
                ]
            },
            {
                id: "armor",
                name: "防具",
                icon: <Shield className="w-5 h-5" />,
                items: [
                    { name: "頭盔", max: 4, type: "equipment" },
                    { name: "盔甲", max: 2, type: "equipment" },
                    { name: "斗篷", max: 2, type: "equipment" },
                    { name: "手套", max: 2, type: "equipment" },
                    { name: "長靴", max: 2, type: "equipment" },
                    { name: "T恤", max: 2, type: "equipment" },
                    { name: "盾牌", max: 2, type: "equipment" },
                    { name: "肩甲 / 臂甲", max: 2, type: "equipment" }
                ]
            },
            {
                id: "accessory",
                name: "飾品",
                icon: <Gem className="w-5 h-5" />,
                items: [
                    { name: "耳環", max: 2, type: "equipment" },
                    { name: "戒指", max: 4, type: "equipment" },
                    { name: "項鍊", max: 2, type: "equipment" },
                    { name: "皮帶", max: 2, type: "equipment" },
                    { name: "手環", max: 2, type: "equipment" }
                ]
            },
            {
                id: "mall",
                name: "商城道具",
                icon: <ShoppingBag className="w-5 h-5" />,
                note: "每件以 4 個轉職幣估算",
                items: [
                    { name: "倫提斯系列", max: 2, type: "mall" },
                    { name: "史奈普系列", max: 2, type: "mall" },
                    { name: "光之皮夾克系列", max: 1, type: "mall" },
                    { name: "英雄光之皮夾克系列", max: 1, type: "mall" },
                    { name: "肩甲系列", max: 1, type: "mall" },
                    { name: "英雄肩甲系列", max: 1, type: "mall" },
                    { name: "催化石", max: 1, type: "mall", itemNote: "精煉能力不會跟著轉移" }
                ]
            },
            {
                id: "skill",
                name: "技能",
                icon: <Zap className="w-5 h-5" />,
                items: [
                    { name: "一般技能", max: 4, type: "skill_general" },
                    { name: "英雄技能", max: 6, type: "skill_hero" },
                    { name: "傳說技能", max: 5, type: "skill_legend" },
                    { name: "傳說技能（血盟）", max: 1, type: "skill_legend_pledge" },
                    { name: "傳說技能（限定）", max: 1, type: "skill_legend_unique" },
                    { name: "神話技能", max: 2, type: "skill_mythic" },
                    { name: "神話技能（特殊）", max: 2, type: "skill_mythic_special", itemNote: "特殊品項暫不列入估算" }
                ]
            }
        ];

        const TOOL_LINKS = [
            { name: "助手備份工具", href: "https://lmcopy.bandonplay.net/" },
            { name: "手遊聯防警報系統", href: "https://lmnotify.bandonplay.net/" },
            { name: "OTiny帳務幫手", href: "https://otiny.bandonplay.net/" }
        ];

        function ClassChangeCalculator() {
            const [counts, setCounts] = useState({});
            const [subItemRarities, setSubItemRarities] = useState({});

            const handleCountChange = (catIndex, itemIndex, value) => {
                const newCount = parseInt(value, 10);
                const itemKey = `${catIndex}-${itemIndex}`;
                const itemType = DATA_STRUCTURE[catIndex].items[itemIndex].type;

                setCounts((prev) => ({ ...prev, [itemKey]: newCount }));

                if (itemType === "equipment" || itemType === "rune") {
                    setSubItemRarities((prev) => {
                        const next = { ...prev };
                        for (let i = 0; i < newCount; i++) {
                            const subKey = `${itemKey}-${i}`;
                            if (!next[subKey]) next[subKey] = itemType === "rune" ? "rare" : "hero";
                        }
                        Object.keys(next).forEach((key) => {
                            if (key.startsWith(`${itemKey}-`) && parseInt(key.split("-")[2], 10) >= newCount) {
                                delete next[key];
                            }
                        });
                        return next;
                    });
                }
            };

            const handleSubItemRarityChange = (catIndex, itemIndex, subIndex, value) => {
                const key = `${catIndex}-${itemIndex}-${subIndex}`;
                setSubItemRarities((prev) => ({ ...prev, [key]: value }));
            };

            const handleReset = () => {
                setCounts({});
                setSubItemRarities({});
            };

            const calculateTotal = () => {
                let items = 0;
                let bags = 0;

                DATA_STRUCTURE.forEach((category, catIndex) => {
                    category.items.forEach((item, itemIndex) => {
                        const key = `${catIndex}-${itemIndex}`;
                        const count = counts[key] || 0;
                        if (count <= 0) return;

                        items += count;

                        if (item.type === "equipment" || item.type === "rune") {
                            for (let i = 0; i < count; i++) {
                                const subKey = `${key}-${i}`;
                                const defaultRarity = item.type === "rune" ? "rare" : "hero";
                                const rarityKey = subItemRarities[subKey] || defaultRarity;
                                bags += RARITY_COSTS[rarityKey].cost;
                            }
                        } else if (item.type === "mall") bags += count * 4;
                        else if (item.type === "skill_general") bags += count * 2;
                        else if (item.type === "skill_mythic") bags += count * 113;
                        else if (item.type === "skill_mythic_special") bags += 0;
                        else if (item.type.includes("skill_legend_unique")) bags += count * 75;
                        else if (item.type.includes("skill_legend_pledge")) bags += count * 60;
                        else if (item.type === "skill_hero") {
                            for (let i = 1; i <= count; i++) bags += i <= 4 ? 7 : 14;
                        } else if (item.type === "skill_legend") {
                            for (let i = 1; i <= count; i++) bags += i <= 4 ? 20 : 40;
                        } else if (item.type === "proficiency") {
                            for (let i = 0; i < count; i++) bags += PROFICIENCY_COSTS[i] || 0;
                        }
                    });
                });

                return { totalItems: items, totalBags: bags };
            };

            const { totalItems, totalBags } = useMemo(calculateTotal, [counts, subItemRarities]);

            const renderOptions = (max) => Array.from({ length: max + 1 }, (_, i) => (
                <option key={i} value={i}>{i}</option>
            ));

            const estimateDiamonds = totalBags === 0
                ? 0
                : Math.max(3000, Math.round((totalBags * 3000 / 44) / 10) * 10).toLocaleString();

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-64 sm:pb-40">
                    <header className="bg-slate-900 border-b border-amber-600/30 sticky top-0 z-20 shadow-lg">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center gap-4">
                            <div className="flex items-center gap-3 min-w-0">
                                <div className="bg-amber-600 p-2 rounded-lg text-slate-950 shadow-sm shadow-amber-900/50 shrink-0">
                                    <Calculator size={24} />
                                </div>
                                <h1 className="text-lg sm:text-xl font-bold text-amber-500 tracking-wide flex flex-col sm:flex-row sm:gap-2 leading-tight">
                                    <span>天堂M 轉職</span>
                                    <span className="text-amber-100/80">成本試算工具</span>
                                </h1>
                            </div>
                            <button
                                onClick={handleReset}
                                className="group flex items-center gap-1.5 text-base font-medium text-slate-300 hover:text-amber-300 bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg border border-slate-700 hover:border-amber-500/30 transition-all shadow-sm shrink-0"
                            >
                                <RotateCcw size={14} className="group-hover:-rotate-180 transition-transform duration-500" />
                                重設
                            </button>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        <section className="mb-8 bg-slate-900/80 p-5 rounded-lg border border-slate-800 shadow-sm flex items-start gap-4">
                            <div className="p-2 bg-slate-950 rounded-full text-blue-400 shrink-0 border border-slate-800">
                                <Info size={24} />
                            </div>
                            <div className="text-base text-slate-300 space-y-1.5 pt-1 leading-relaxed">
                                <p className="font-medium text-slate-100 text-base">使用方式</p>
                                <p>選擇預計轉移的裝備、飾品、商城品項與技能數量，系統會即時計算需要的轉職幣與最低鑽石估算。</p>
                                <p className="text-amber-400 font-medium flex items-center gap-1">
                                    <ArrowRight size={14} />
                                    裝備類可逐件切換稀有、英雄、傳說、神話；符石固定以稀有成本計算。
                                </p>
                            </div>
                        </section>

                        <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {DATA_STRUCTURE.map((category, catIndex) => {
                                const isMall = category.id === "mall";

                                const categoryCard = (
                                    <div
                                        key={category.id}
                                        className="bg-slate-900 rounded-lg overflow-hidden border border-slate-800 shadow-lg hover:shadow-2xl hover:border-slate-700 transition-all duration-300 flex flex-col h-full ring-1 ring-slate-950/50"
                                    >
                                        <div className="bg-slate-950/80 px-5 py-4 border-b border-slate-800 flex flex-col gap-1">
                                            <div className="flex items-center gap-2.5 text-amber-500 font-bold text-lg">
                                                <span className="text-amber-600">{category.icon}</span>
                                                {category.name}
                                            </div>
                                            {category.note && (
                                                <div className="text-sm text-yellow-500/80 mt-1 pl-8 font-medium">
                                                    {category.note}
                                                </div>
                                            )}
                                        </div>

                                        <div className="p-4 space-y-3 flex-1 bg-slate-900">
                                            {category.items.map((item, itemIndex) => {
                                                const key = `${catIndex}-${itemIndex}`;
                                                const currentCount = counts[key] || 0;
                                                const isEquipment = item.type === "equipment" || item.type === "rune";

                                                let subtotalCost = 0;
                                                if (currentCount > 0) {
                                                    if (isEquipment) {
                                                        for (let i = 0; i < currentCount; i++) {
                                                            const subKey = `${key}-${i}`;
                                                            const defaultRarity = item.type === "rune" ? "rare" : "hero";
                                                            const rKey = subItemRarities[subKey] || defaultRarity;
                                                            subtotalCost += RARITY_COSTS[rKey].cost;
                                                        }
                                                    } else if (item.type === "mall") subtotalCost = currentCount * 4;
                                                    else if (item.type === "skill_general") subtotalCost = currentCount * 2;
                                                    else if (item.type === "skill_mythic") subtotalCost = currentCount * 113;
                                                    else if (item.type === "skill_mythic_special") subtotalCost = 0;
                                                    else if (item.type.includes("skill_legend_unique")) subtotalCost = currentCount * 75;
                                                    else if (item.type.includes("skill_legend_pledge")) subtotalCost = currentCount * 60;
                                                    else if (item.type === "skill_hero") {
                                                        for (let i = 1; i <= currentCount; i++) subtotalCost += i <= 4 ? 7 : 14;
                                                    } else if (item.type === "skill_legend") {
                                                        for (let i = 1; i <= currentCount; i++) subtotalCost += i <= 4 ? 20 : 40;
                                                    } else if (item.type === "proficiency") {
                                                        for (let i = 0; i < currentCount; i++) subtotalCost += PROFICIENCY_COSTS[i] || 0;
                                                    }
                                                }

                                                return (
                                                    <div
                                                        key={item.name}
                                                        className={`relative rounded-lg transition-all duration-300 border ${currentCount > 0
                                                            ? "bg-slate-800/80 border-amber-500/30 ring-1 ring-amber-500/10 shadow-md"
                                                            : "bg-slate-800/30 border-transparent hover:border-slate-700"
                                                            }`}
                                                    >
                                                        <div className="p-3 flex items-center justify-between gap-3">
                                                            <div className="flex flex-col pl-1 min-w-0">
                                                                <span className={`font-medium transition-colors ${currentCount > 0 ? "text-amber-100" : "text-slate-300"}`}>
                                                                    {item.name}
                                                                </span>
                                                                {item.itemNote && (
                                                                    <span className="text-sm text-amber-500/80 font-medium leading-snug">
                                                                        {item.itemNote}
                                                                    </span>
                                                                )}
                                                                <span className="text-sm text-slate-400">上限：{item.max}</span>
                                                            </div>

                                                            <div className="flex items-center gap-3 shrink-0">
                                                                {currentCount > 0 && (
                                                                    <div className="flex items-center gap-1.5 text-amber-400 font-bold text-base bg-slate-950/80 px-2.5 py-1 rounded border border-amber-500/30 shadow-sm">
                                                                        <Coins size={12} className="text-amber-500" />
                                                                        <span>{subtotalCost}</span>
                                                                    </div>
                                                                )}

                                                                <div className="relative group">
                                                                    <select
                                                                        aria-label={`${item.name} 數量`}
                                                                        value={currentCount}
                                                                        onChange={(e) => handleCountChange(catIndex, itemIndex, e.target.value)}
                                                                        className={`appearance-none w-16 py-1.5 pl-3 pr-7 rounded-md font-bold text-center outline-none focus:ring-2 transition-all text-base border cursor-pointer ${currentCount > 0
                                                                            ? "bg-amber-600 text-white border-amber-600 focus:ring-amber-500 shadow-md shadow-amber-900/30"
                                                                            : "bg-slate-950 text-slate-400 border-slate-700 hover:border-slate-500 focus:ring-slate-500"}`}
                                                                    >
                                                                        {renderOptions(item.max)}
                                                                    </select>
                                                                    <div className={`pointer-events-none absolute inset-y-0 right-0 flex items-center px-1.5 transition-colors ${currentCount > 0 ? "text-white" : "text-slate-500"}`}>
                                                                        <ChevronDown size={14} strokeWidth={3} />
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {currentCount > 0 && isEquipment && (
                                                            <div className="px-3 py-3 bg-slate-950/40 border-t border-slate-700/40 space-y-2.5 rounded-b-lg">
                                                                {Array.from({ length: currentCount }).map((_, subIndex) => {
                                                                    const subKey = `${key}-${subIndex}`;
                                                                    const defaultRarity = item.type === "rune" ? "rare" : "hero";
                                                                    const currentRarityKey = subItemRarities[subKey] || defaultRarity;
                                                                    const rarityInfo = RARITY_COSTS[currentRarityKey];

                                                                    return (
                                                                        <div key={subIndex} className="flex items-center justify-between gap-2 text-base bg-slate-900/70 p-2 rounded border border-slate-800">
                                                                            <div className="flex items-center gap-2 text-slate-400 pl-1">
                                                                                <div className={`w-2 h-2 rounded-full ${rarityInfo.dotClass}`}></div>
                                                                                <span className="font-medium text-sm">第 {subIndex + 1} 件</span>
                                                                            </div>

                                                                            <div className="flex items-center gap-2">
                                                                                <div className="relative">
                                                                                    <select
                                                                                        aria-label={`${item.name} 第 ${subIndex + 1} 件稀有度`}
                                                                                        value={currentRarityKey}
                                                                                        onChange={(e) => handleSubItemRarityChange(catIndex, itemIndex, subIndex, e.target.value)}
                                                                                        className={`appearance-none text-sm py-1.5 pl-2.5 pr-7 rounded cursor-pointer outline-none border transition-all font-bold shadow-sm ${rarityInfo.badgeClass} focus:ring-1 focus:ring-offset-1 focus:ring-slate-500 focus:ring-offset-slate-800`}

                                                                                                <option key={rKey} value={rKey} className="bg-slate-900 text-slate-200">
                                                                                                    {val.name}

                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}

                                        </React.Fragment>

                                return categoryCard;
                            })}
